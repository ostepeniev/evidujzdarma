# EvidujZdarma – мікрокеш каталогу фірм (S3). Контекст http: файл кладемо в /etc/nginx/conf.d/ (підключається з http {}
# у стандартному nginx.conf Ubuntu) ПЕРЕД перезавантаженням vhost-а, бо infra/nginx/evidujzdarma.conf посилається на зону ez_catalog.
# Ім'я зони й шлях унікальні для цього сайту – чужих vhost-ів не торкається.
#
#   keys_zone=ez_catalog:20m – близько 160 000 ключів (≈ 8 000 на 1 МБ) у спільній пам'яті;
#   max_size=1g              – стеля на диску (сторінка ≈ 30–80 КБ), старі записи витісняються;
#   inactive=60m             – запис, який годину ніхто не запитав, видаляється;
#   levels=1:2               – дві рівні каталогів (не тисячі файлів в одній теці);
#   use_temp_path=off        – файл пишеться одразу в теку кешу (без копіювання з proxy_temp).
#
# Кроки й перевірка – docs/deploy.md, розділ «Мікрокеш каталогу».
proxy_cache_path /var/cache/nginx/evidujzdarma levels=1:2 keys_zone=ez_catalog:20m max_size=1g inactive=60m use_temp_path=off;
