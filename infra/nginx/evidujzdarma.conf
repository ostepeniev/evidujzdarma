# EvidujZdarma за наявним nginx (docs/DECISIONS.md, Т7). Повторює infra/Caddyfile:
#   - X-Real-IP завжди перезаписується адресою клієнта (R3.11: застосунок читає лише його);
#   - ліміт тіла 128 КБ для /api/ucet/certifikat і 1 МБ для решти (R3.2);
#   - /api/internal/* назовні 404 (у застосунку його ще й закриває CRON_SECRET);
#   - www → головний домен.
# З 3. 10. 2026 (eet-open-site) сайт публічний; за basic auth лише секції з apps/web/src/lib/launch.ts.
# Порт 3100 = WEB_PORT з infra/docker-compose.nginx.yml. Кроки — docs/deploy.md, розділ 8.
# Не вмикайте тут http2 у listen: на nginx < 1.25 це змінило б і чужі vhost-и на тому ж :443.

# Лог без query string і повного Referer: у них токени /registrace/potvrzeni?token=… і /namitka/potvrzeni?token=… (рецензія №4, B M2).
# Із Referer беремо лише домен джерела (google.com, seznam.cz, chatgpt.com…) — для підрахунку переходів без аналітики (SEO S1.4, 7. 10. 2026).
# map і log_format живуть у контексті http (файл підключається з http {}), тож імена мають бути унікальними серед усіх vhost-ів.
map $http_referer $ez_ref_host {
    default "-";
    "~^https?://(?:www\.)?(?<ez_rh>[^/:?#]+)" $ez_rh;
}
log_format ez_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent" ref=$ez_ref_host';

server {
    listen 80;
    listen [::]:80;
    server_name evidujzdarma.cz www.evidujzdarma.cz;
    access_log /var/log/nginx/evidujzdarma.access.log ez_noquery;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 301 https://evidujzdarma.cz$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.evidujzdarma.cz;
    access_log /var/log/nginx/evidujzdarma.access.log ez_noquery;

    ssl_certificate /etc/letsencrypt/live/evidujzdarma.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evidujzdarma.cz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://evidujzdarma.cz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name evidujzdarma.cz;
    access_log /var/log/nginx/evidujzdarma.access.log ez_noquery;

    ssl_certificate /etc/letsencrypt/live/evidujzdarma.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evidujzdarma.cz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 1m;

    # eet-open-site: auth_basic на рівні server прибрано. Закриті лише секції з apps/web/src/lib/launch.ts
    # (CLOSED_SECTIONS, CLOSED_API). Змінюєте список — змінюйте обидва місця.

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;
    # УВАГА: у location нижче НЕ додавати proxy_set_header – location тоді втратить усі серверні (X-Real-IP!).

    location ^~ /api/internal/ {
        return 404;
    }
    # exact-збіг має перевагу над regex: без auth_basic тут цей маршрут був би відкритий
    location = /api/ucet/certifikat {
        auth_basic "EvidujZdarma";
        auth_basic_user_file /etc/nginx/evidujzdarma.htpasswd;
        client_max_body_size 128k;
        proxy_pass http://127.0.0.1:3100;
    }
    # Каса: Authorization: Bearer <токен пристрою>; застосунок пускає лише з дійсним токеном
    location ^~ /api/pokladna/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:3100;
    }
    location = /api/health {
        auth_basic off;
        proxy_pass http://127.0.0.1:3100;
    }
    # Закриті API (session cookie) = CLOSED_API
    location ~ ^/api/(ucet|auth|kabinet|pozvanka)(/|$) {
        auth_basic "EvidujZdarma";
        auth_basic_user_file /etc/nginx/evidujzdarma.htpasswd;
        proxy_pass http://127.0.0.1:3100;
    }
    # Закриті сторінки = CLOSED_SECTIONS. Каталог фірм (/firmy, /firma, /provozovna, /obor) відкрито в S3 (LIA, docs/LIA-katalog-firem.md).
    location ~ ^/(pokladna|prihlaseni|kabinet|pozvanka|u)(/|$) {
        auth_basic "EvidujZdarma";
        auth_basic_user_file /etc/nginx/evidujzdarma.htpasswd;
        proxy_pass http://127.0.0.1:3100;
    }
    # S3: каталог фірм – мікрокеш (зона ez_catalog з /etc/nginx/conf.d/evidujzdarma-cache.conf, спершу нанести той файл).
    # Живий перегляд з ARES /firma/{IČO} без slug (ліміт на IP, недоступність ARES) – без кешу; regex-location іде першою.
    # Regex із {8} мусить бути в лапках, інакше nginx сприйме „{“ як початок блоку.
    location ~ "^/firma/[0-9]{8}/?$" {
        proxy_pass http://127.0.0.1:3100;
    }
    # Ключ без query: запити з ?… (сторінкування, пошук ?q=, RSC ?_rsc=) кеш оминають і не зберігаються – інакше
    # випадкові параметри заповнили б кеш. Кешуються лише 200/301/308 на 10 хв; Cache-Control застосунку тут ігнорується
    # (404 і 500 не кешуються). Каталог не надсилає Set-Cookie – відповідь із Set-Cookie nginx і так не закешує.
    location ~ ^/(firma|firmy|obor|provozovna)(/|$) {
        proxy_cache ez_catalog;
        proxy_cache_key $scheme$host$uri$ez_cache_ae;
        proxy_cache_bypass $is_args $ez_cache_rsc;
        proxy_no_cache $is_args $ez_cache_rsc;
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 301 308 10m;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        add_header X-Cache-Status $upstream_cache_status always;
        proxy_pass http://127.0.0.1:3100;
    }
    # Obrázky značky (logo, obálky sociálních sítí) – veřejné; soubory v /var/www/evidujzdarma-brand
    location ^~ /brand/ {
        alias /var/www/evidujzdarma-brand/;
        default_type image/png;
        expires 1d;
    }
    # Seznam Webmaster: ověření vlastnictví webu (soubor z kabinetu Seznam, 3. 10. 2026)
    location = /seznam-wmt-3psF4XbFXnXhzmisUHYTbrCus8pjG9MD.txt {
        default_type text/plain;
        return 200 "3psF4XbFXnXhzmisUHYTbrCus8pjG9MD";
    }
    # Bing Webmaster Tools: ověření vlastnictví webu souborem BingSiteAuth.xml (7. 10. 2026)
    location = /BingSiteAuth.xml {
        default_type text/xml;
        return 200 '<?xml version="1.0"?>\n<users>\n\t<user>3D57068978CD00A8708EFB2FF05E88CE</user>\n</users>\n';
    }
    location / {
        proxy_pass http://127.0.0.1:3100;
    }
}
