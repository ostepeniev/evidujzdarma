# EvidujZdarma за наявним nginx (docs/DECISIONS.md, Т7). Повторює infra/Caddyfile:
#   - X-Real-IP завжди перезаписується адресою клієнта (R3.11: застосунок читає лише його);
#   - ліміт тіла 128 КБ для /api/ucet/certifikat і 1 МБ для решти (R3.2);
#   - /api/internal/* назовні 404 (у застосунку його ще й закриває CRON_SECRET);
#   - www → головний домен.
# Порт 3100 = WEB_PORT з infra/docker-compose.nginx.yml. Кроки — docs/deploy.md, розділ 8.
# Не вмикайте тут http2 у listen: на nginx < 1.25 це змінило б і чужі vhost-и на тому ж :443.

# Лог без query string і Referer: у них токени /registrace/potvrzeni?token=… і /namitka/potvrzeni?token=… (рецензія №4, B M2).
# log_format живе в контексті http (файл підключається з http {}), тож ім'я має бути унікальним серед усіх vhost-ів.
log_format ez_noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name evidujzdarma.cz www.evidujzdarma.cz;
    access_log /var/log/nginx/evidujzdarma.access.log ez_noquery;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / {
        return 301 https://evidujzdarma.cz$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.evidujzdarma.cz;
    access_log /var/log/nginx/evidujzdarma.access.log ez_noquery;

    ssl_certificate /etc/letsencrypt/live/evidujzdarma.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evidujzdarma.cz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://evidujzdarma.cz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name evidujzdarma.cz;
    access_log /var/log/nginx/evidujzdarma.access.log ez_noquery;

    ssl_certificate /etc/letsencrypt/live/evidujzdarma.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evidujzdarma.cz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 1m;

    # Поки немає SMTP, сайт закритий (docs/deploy.md, розділ 8). Після запуску пошти — видалити ці два рядки.
    auth_basic "EvidujZdarma";
    auth_basic_user_file /etc/nginx/evidujzdarma.htpasswd;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;

    location ^~ /api/internal/ {
        return 404;
    }
    location = /api/ucet/certifikat {
        client_max_body_size 128k;
        proxy_pass http://127.0.0.1:3100;
    }
    # Каса ходить з Authorization: Bearer <токен пристрою>; basic auth цей заголовок перебив би (401).
    # Маршрути /api/pokladna/* застосунок і так пускає лише з дійсним токеном пристрою.
    location ^~ /api/pokladna/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:3100;
    }
    location = /api/health {
        auth_basic off;
        proxy_pass http://127.0.0.1:3100;
    }
    location / {
        proxy_pass http://127.0.0.1:3100;
    }
}
